  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }
    #obs-overlay-root {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
      position: relative;
    }
    #chat-messages-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
      padding: 14px;
    }
    .avatar-hexagon {
      clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0% 50%);
    }
    @keyframes emoteBounce { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-4px) scale(1.08); } }
    @keyframes emoteJam { 0%, 100% { transform: rotate(-10deg) scale(1.05); } 50% { transform: rotate(12deg) scale(1.1) translateY(-2px); } }
    @keyframes emoteSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes emotePulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
    @keyframes emoteShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-2px) rotate(-5deg); } 75% { transform: translateX(2px) rotate(5deg); } }
    .anim-emote-jam { display: inline-block; animation: emoteJam 0.48s infinite ease-in-out; }
    .anim-emote-bounce { display: inline-block; animation: emoteBounce 0.6s infinite ease-in-out; }
    .anim-emote-spin { display: inline-block; animation: emoteSpin 1.4s infinite linear; }
    .anim-emote-pulse { display: inline-block; animation: emotePulse 0.7s infinite ease-in-out; }
    .anim-emote-shake { display: inline-block; animation: emoteShake 0.35s infinite ease-in-out; }
    @keyframes announcePulseGlow {
      0%, 100% { box-shadow: 0 0 18px rgba(245, 158, 11, 0.45), inset 0 0 12px rgba(245, 158, 11, 0.2); }
      50% { box-shadow: 0 0 30px rgba(236, 72, 153, 0.75), inset 0 0 20px rgba(245, 158, 11, 0.35); }
    }
    @keyframes sweepLight { 0% { left: -120%; } 45%, 100% { left: 160%; } }
    .sb-announcement-card {
      animation: announcePulseGlow 2.2s infinite ease-in-out !important;
      position: relative;
      overflow: hidden;
    }
    .sb-announcement-card::after {
      content: "";
      position: absolute;
      top: 0; left: -120%;
      width: 65%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
      transform: skewX(-25deg);
      animation: sweepLight 3.2s infinite;
      pointer-events: none;
    }

        if (CONFIG.imagePngMode === 'message_border') {
          card.style.border = `${CONFIG.imagePngWidth}px solid transparent`;
          card.style.borderImage = `url('${imgUrl}') ${CONFIG.imagePngSlice} fill / ${CONFIG.imagePngWidth}px stretch`;
        } else if (CONFIG.imagePngMode === 'message_bg') {
          card.style.backgroundImage = `url('${imgUrl}')`;
          card.style.backgroundSize = 'cover';
          card.style.backgroundPosition = 'center';
        }
      }

      // 9. Announcement Pop More Override
      let announcementBannerHTML = '';
      if (msgData.isAnnouncement && CONFIG.announcementPop) {
        card.classList.add('sb-announcement-card');
        card.style.width = '100%';
        card.style.transform = 'scale(1.01)';
        const themes = {
          gold_royal: { bg: 'linear-gradient(135deg, rgba(120, 53, 15, 0.94), rgba(30, 27, 75, 0.94))', border: '#f59e0b', bannerBg: 'linear-gradient(90deg, #f59e0b, #ec4899)', text: '#fef3c7' },
          cyber_magenta: { bg: 'linear-gradient(135deg, rgba(80, 7, 36, 0.94), rgba(15, 23, 42, 0.94))', border: '#ec4899', bannerBg: 'linear-gradient(90deg, #ec4899, #06b6d4)', text: '#fce7f3' },
          emerald_flare: { bg: 'linear-gradient(135deg, rgba(6, 78, 59, 0.94), rgba(15, 23, 42, 0.94))', border: '#10b981', bannerBg: 'linear-gradient(90deg, #10b981, #eab308)', text: '#d1fae5' },
          crimson_alert: { bg: 'linear-gradient(135deg, rgba(127, 29, 29, 0.94), rgba(17, 24, 39, 0.94))', border: '#ef4444', bannerBg: 'linear-gradient(90deg, #ef4444, #f97316)', text: '#fee2e2' }
        };
        const th = themes[CONFIG.announcementTheme] || themes.gold_royal;
        card.style.background = th.bg;
        card.style.border = `2px solid ${th.border}`;
        announcementBannerHTML = `
          <div style="background:${th.bannerBg}; color:#090a0f; font-weight:900; font-size:10px; letter-spacing:0.08em; text-transform:uppercase; padding:3px 8px; border-radius:6px; margin-bottom:6px; display:inline-flex; align-items:center; gap:5px;">
            <span>${escapeHtml(CONFIG.announcementTitle || '📢 STREAM ANNOUNCEMENT')}</span>
          </div>
        `;
      }

      // 10. Build Avatar, Badges, Username & Message Content
      const avatarSize = CONFIG.avatarSize || 32;
      const avatarRadius = CONFIG.avatarShape === 'circle' ? '9999px' : CONFIG.avatarShape === 'rounded' ? '8px' : '0px';
      const avatarHexClass = CONFIG.avatarShape === 'hexagon' ? 'avatar-hexagon' : '';
      const avatarHTML = CONFIG.showAvatars ? `
        <img
          src="${resolveAvatarUrl(msgData)}"
          onerror="this.onerror=null;this.src='https://placehold.co/64x64/6d28d9/ffffff?text=${encodeURIComponent((msgData.username || 'U').slice(0,2).toUpperCase())}';"
          class="${avatarHexClass} shrink-0 object-cover"
          style="width:${avatarSize}px; height:${avatarSize}px; border-radius:${avatarRadius}; border:2px solid ${activeAccentColor};"
          alt="${escapeHtml(msgData.username)}"
        />
      ` : '';

      const platformBadgeHTML = CONFIG.showPlatformBadge ? getPlatformIconSVG(platform) : '';
      const roleBadgesHTML = (CONFIG.showBadges && Array.isArray(msgData.badges))
        ? msgData.badges.map(getRoleBadgeHTML).join('')
        : '';

      const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const timestampHTML = CONFIG.showTimestamp
        ? `<span style="font-size:0.75em; opacity:0.6; margin-right:4px;">${timeStr}</span>`
        : '';

      const parsedMessageHTML = renderTextWithEmotes(modResult.text, msgData.emotes);

      if (layoutMode === 'inline') {
        card.innerHTML = `
          ${announcementBannerHTML}
          <div style="display:flex; align-items:center; gap:8px;">
            ${avatarHTML}
            <div style="min-width:0; word-break:break-word;">
              <span style="display:inline-flex; align-items:center; gap:4px; vertical-align:middle; margin-right:4px;">
                ${timestampHTML}
                ${platformBadgeHTML}
                ${roleBadgesHTML}
                <span style="font-weight:${CONFIG.usernameWeight}; color:${usernameColor};">${escapeHtml(msgData.username)}:</span>
              </span>
              <span style="vertical-align:middle;">${parsedMessageHTML}</span>
            </div>
          </div>
        `;
      } else {
        card.innerHTML = `
          ${announcementBannerHTML}
          <div style="display:flex; align-items:flex-start; gap:10px;">
            ${avatarHTML}
            <div style="flex:1; min-width:0;">
              <div style="display:flex; align-items:center; flex-wrap:wrap; gap:5px; margin-bottom:2px;">
                ${timestampHTML}
                ${platformBadgeHTML}
                ${roleBadgesHTML}
                <span style="font-weight:${CONFIG.usernameWeight}; color:${usernameColor};">${escapeHtml(msgData.username)}</span>
              </div>
              <div style="word-break:break-word;">${parsedMessageHTML}</div>
            </div>
          </div>
        `;
      }

      wrapper.appendChild(card);
      listEl.appendChild(wrapper);

      // 11. Track Active Message & Set Auto-Disappear Timer if enabled
      let timerId = null;
      if (!CONFIG.showAlways) {
        const mult = CONFIG.hideAfterUnit === 'minutes' ? 60000 : 1000;
        const ms = Math.max(1000, (CONFIG.hideAfterValue || 30) * mult);
        timerId = setTimeout(() => {
          removeMessageElement(msgId);
        }, ms);
      }

      activeMessages.push({
        id: msgId,
        userId: String(msgData.userId || ''),
        username: String(msgData.username || '').toLowerCase(),
        platform,
        wrapperEl: wrapper,
        cardEl: card,
        timerId
      });

      // 12. Enforce Max Messages Limit
      while (activeMessages.length > (CONFIG.maxMessages || 15)) {
        const oldest = activeMessages.shift();
        if (oldest) {
          clearTimeout(oldest.timerId);
          animateAndRemoveNode(oldest.wrapperEl, oldest.cardEl);
        }
      }
    }
    function animateAndRemoveNode(wrapperEl, cardEl) {
      if (!wrapperEl || !wrapperEl.parentNode) return;
      if (cardEl) {
        cardEl.style.animation = `out_${CONFIG.outEffect || 'fade_up'} 320ms ease forwards`;
      }
      setTimeout(() => {
        if (wrapperEl.parentNode) wrapperEl.parentNode.removeChild(wrapperEl);
      }, 310);
    }
    function removeMessageElement(msgId) {
      const idx = activeMessages.findIndex(m => m.id === msgId);
      if (idx === -1) return;
      const item = activeMessages[idx];
      activeMessages.splice(idx, 1);
      clearTimeout(item.timerId);
      animateAndRemoveNode(item.wrapperEl, item.cardEl);
    }
    function removeMessagesByUser(userId, username) {
      if (!CONFIG.deleteOnBanOrDelete) return;
      const targetUser = String(username || '').toLowerCase();
      const targetId = String(userId || '');
      const toRemove = activeMessages.filter(m =>
        (targetId && m.userId === targetId) || (targetUser && m.username === targetUser)
      );
      toRemove.forEach(m => removeMessageElement(m.id));
      if (toRemove.length > 0) {
        showToastFilterFeedback(`Deleted ${toRemove.length} msg(s) from banned/moderated user`);
      }
    }
    function clearAllMessages() {
      activeMessages.forEach(m => clearTimeout(m.timerId));
      activeMessages = [];
      const listEl = document.getElementById('chat-messages-list');
      if (listEl) listEl.innerHTML = '';
    }
    function handleStreamerBotPayload(payload) {
      if (!payload || !payload.event) return;
      const source = (payload.event.source || '').toLowerCase();
      const type = (payload.event.type || '').toLowerCase();
      const d = payload.data || {};

      // Moderation / Deletion Events
      if (type.includes('deleted')) {
        const targetMsgId = d.messageId || d.msgId || (d.message && d.message.msgId);
        if (targetMsgId && CONFIG.deleteOnBanOrDelete) {
          removeMessageElement(targetMsgId);
        }
        return;
      }
      if (type.includes('banned') || type.includes('timedout')) {
        const uid = d.userId || (d.user && d.user.id) || '';
        const uname = d.userName || d.username || (d.user && d.user.name) || (d.user && d.user.login) || '';
        removeMessagesByUser(uid, uname);
        return;
      }
      if (type.includes('cleared')) {
        clearAllMessages();
        return;
      }

      // Twitch ChatMessage / Announcement
      if (source === 'twitch' && (type === 'chatmessage' || type === 'announcement')) {
        const m = d.message || d;
        addChatMessageToOverlay({
          id: m.msgId || d.messageId || ('tw_' + Date.now()),
          userId: m.userId || (d.user && d.user.id) || '',
          username: m.displayName || m.username || (d.user && d.user.name) || 'TwitchUser',
          platform: 'twitch',
          text: m.message || d.text || '',
          userColor: m.color || (d.user && d.user.color) || '#9146FF',
          avatar: d.profileImageUrl || m.profileImageUrl || (d.user && d.user.profileImageUrl) || '',
          badges: m.badges || d.badges || [],
          emotes: m.emotes || d.emotes || [],
          isAnnouncement: type === 'announcement',
          isBot: Boolean(m.isBot)
        });
        return;
      }

      // YouTube Message / SuperChat
      if (source === 'youtube' && (type === 'message' || type === 'superchat')) {
        const u = d.user || {};
        addChatMessageToOverlay({
          id: d.eventId || ('yt_' + Date.now()),
          userId: u.id || '',
          username: u.name || d.authorName || 'YouTubeUser',
          platform: 'youtube',
          text: d.message || '',
          userColor: '#FF0000',
          avatar: u.profileImageUrl || d.profileImageUrl || '',
          badges: [
            ...(u.isOwner ? ['broadcaster'] : []),
            ...(u.isModerator ? ['moderator'] : []),
            ...(u.isSponsor ? ['subscriber'] : []),
            ...(u.isVerified ? ['verified'] : [])
          ],
          emotes: d.emotes || [],
          isAnnouncement: type === 'superchat'
        });
        return;
      }

      // Kick ChatMessage
      if (source === 'kick' && type === 'chatmessage') {
        const m = d.message || d;
        const u = d.user || m.sender || {};
        addChatMessageToOverlay({
          id: m.id || d.messageId || ('kk_' + Date.now()),
          userId: u.id || m.userId || '',
          username: u.username || u.name || m.displayName || 'KickUser',
          platform: 'kick',
          text: m.content || m.message || d.text || '',
          userColor: (u.identity && u.identity.color) || m.color || '#53FC18',
          avatar: u.profilePic || u.profile_pic || u.avatar || d.profileImageUrl || '',
          badges: m.badges || (u.identity && u.identity.badges) || [],
          emotes: m.emotes || d.emotes || [],
          isAnnouncement: false
        });
      }
    }
    function applyContainerBackgroundStyles() {
      const root = document.getElementById('obs-overlay-root');
      if (!root) return;

      root.style.background = 'transparent';
      root.style.border = 'none';
      root.style.borderImage = 'none';
      root.style.webkitMaskImage = CONFIG.topFadeMask
        ? 'linear-gradient(to bottom, transparent 0%, black 14%, black 100%)'
        : 'none';
      root.style.maskImage = CONFIG.topFadeMask
        ? 'linear-gradient(to bottom, transparent 0%, black 14%, black 100%)'
        : 'none';

      const alpha = (CONFIG.bgOpacity ?? 75) / 100;

      if (CONFIG.bgMode === 'solid') {
        root.style.background = hexToRgba(CONFIG.bgColor1, alpha);
      } else if (CONFIG.bgMode === 'fade') {
        root.style.background = `linear-gradient(${CONFIG.bgGradientAngle}deg, ${hexToRgba(CONFIG.bgColor1, alpha)}, ${hexToRgba(CONFIG.bgColor2, alpha)})`;
      } else if (CONFIG.bgMode === 'image_png') {
        const imgUrl = CONFIG.imagePngPreviewDataUrl || CONFIG.imagePngPath || './image.png';
        if (CONFIG.imagePngMode === 'container_border') {
          root.style.border = `${CONFIG.imagePngWidth}px solid transparent`;
          root.style.borderImage = `url('${imgUrl}') ${CONFIG.imagePngSlice} fill / ${CONFIG.imagePngWidth}px stretch`;
        } else if (CONFIG.imagePngMode === 'container_bg') {
          root.style.backgroundImage = `url('${imgUrl}')`;
          root.style.backgroundSize = 'cover';
          root.style.backgroundPosition = 'center';
        }
      }

      // Highlight active background mode button
      ['transparent', 'image_png', 'solid', 'fade'].forEach(m => {
        const btn = document.getElementById('bg-mode-' + m);
        if (btn) {
          if (CONFIG.bgMode === m) {
            btn.className = 'p-3 rounded-xl border text-left transition bg-cyan-500/15 border-cyan-400 shadow-sm';
          } else {
            btn.className = 'p-3 rounded-xl border text-left transition bg-[#0b0d14] border-white/10 hover:bg-white/5';
          }
        }
      });
    }

    function connectStreamerBot() {
      const ws = new WebSocket(CONFIG.wsUrl || 'ws://127.0.0.1:8080/');
      ws.onopen = () => {
        ws.send(JSON.stringify({
          request: 'Subscribe',
          id: 'obs-chat-overlay-sub',
          events: {
            Twitch: ['ChatMessage', 'Announcement', 'ChatMessageDeleted', 'UserBanned', 'UserTimedOut', 'ChatCleared'],
            YouTube: ['Message', 'SuperChat', 'MessageDeleted', 'UserBanned'],
            Kick: ['ChatMessage', 'ChatMessageDeleted', 'UserBanned', 'UserTimedOut'],
            General: ['Custom']
          }
        }));
      };
      ws.onmessage = (event) => {
        try {
          handleStreamerBotPayload(JSON.parse(event.data));
        } catch (e) {}
      };
      ws.onclose = () => {
        setTimeout(connectStreamerBot, 3000);
      };
    }

    window.addEventListener('DOMContentLoaded', () => {
      applyContainerBackgroundStyles();
      connectStreamerBot();
    });
  </script>
</body>
</html>
